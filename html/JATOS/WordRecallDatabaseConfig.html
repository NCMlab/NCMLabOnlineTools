    <script>
      // =============================================================
      // DATABASE CONFIGURATION
      // Update this URL to point to your deployed API_task_config.php
      // =============================================================
      const DB_API_URL = 'http://localhost/api/API_task_config.php';

      // =============================================================
      // Fetch a parameter set from the database.
      // Returns a Promise that resolves to the parameters object.
      // =============================================================
      async function fetchParameters(taskName, parameterName) {
        const url = `${DB_API_URL}?type=parameters`
                  + `&task=${encodeURIComponent(taskName)}`
                  + `&name=${encodeURIComponent(parameterName)}`;
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Parameters fetch failed (${response.status}) for name="${parameterName}"`);
        }
        return response.json();
      }

      // =============================================================
      // Fetch an instruction set from the database.
      // Returns a Promise that resolves to the Instructions object.
      // =============================================================
      async function fetchInstructions(taskName, instructionName, lang) {
        const url = `${DB_API_URL}?type=instructions`
                  + `&task=${encodeURIComponent(taskName)}`
                  + `&name=${encodeURIComponent(instructionName)}`
                  + `&lang=${encodeURIComponent(lang)}`;
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Instructions fetch failed (${response.status}) for name="${instructionName}" lang="${lang}"`);
        }
        return response.json();
      }

      // =============================================================
      // Main task configuration: replaces the jatos.onLoad block in
      // WordRecall.html.  The key difference is that this is async so
      // it can await the two database fetches before the task starts.
      // The rest of the behaviour is identical to the original file.
      // =============================================================

      var parameters = 'empty';

      jatos.onLoad(async () => {

        // -- 1. Determine which parameter set and instruction set to use --------
        //    This logic is unchanged from the original WordRecall.html.
        let parameterName, InstructionsToUse;
        if (jatos.studySessionData.ComponentParameterLists[jatos.studySessionData.CurrentIndex] === 'undefined') {
          parameterName    = 'RAVLT_Spoken_Immediate';
          InstructionsToUse = 'Default';
        } else {
          parameterName    = jatos.studySessionData.ComponentParameterLists[jatos.studySessionData.CurrentIndex];
          InstructionsToUse = jatos.studySessionData.InstructionList[jatos.studySessionData.CurrentIndex];
        }
        console.log('Database config: parameter name =', parameterName);
        console.log('Database config: instruction name =', InstructionsToUse);

        // -- 2. Get language from JATOS batch session (unchanged) ---------------
        LANG = jatos.batchSession.get(jatos.workerId + "_Language");
        console.log('Language:', LANG);

        // -- 3. Fetch parameters from the database (replaces pseudoSwitch) ------
        try {
          parameters = await fetchParameters('Word Recall', parameterName);
          console.log('Parameters loaded from database:', parameters);
        } catch (err) {
          console.error('FATAL: Could not load parameters from database.', err);
          // Without parameters the task cannot run — stop here.
          return;
        }

        // -- 4. Fetch instructions from the database (replaces pseudoSwitch) ----
        try {
          Instructions = await fetchInstructions('Word Recall', InstructionsToUse, LANG);
          console.log('Instructions loaded from database:', Instructions);
        } catch (err) {
          console.error('FATAL: Could not load instructions from database.', err);
          return;
        }

        // -- 5. Load word lists via pseudoSwitch (not yet in database) ----------
        //    parameters.WordList is a string like 'RAVLT' — same as before.
        console.log('Word list:', LANG + '_' + parameters.WordList);
        pseudoSwitch(LANG + "_" + parameters.WordList);

        // -- 6. Load label names via pseudoSwitch (unchanged) -------------------
        pseudoSwitch(LANG + '_LabelNames');
        console.log('Instructions object:', Instructions);

      });
    </script>
