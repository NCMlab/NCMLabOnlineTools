   <style>
  /* Center the whole survey/question area on the page */
  .jspsych-content {
    text-align: center;            /* center children (the survey root) */
  }

  /* The SurveyJS root: make it an inline-block so it can be centered */
  .jspsych-content .sd-root-modern {
    display: inline-block;
    text-align: left;              /* everything INSIDE is left-aligned */
    width: 90%;
    max-width: 100%;
  }

  /* Make all radiogroup choices start at the same left position */

  .sd-question--radiogroup .sd-selectbase__item,
  .sd-question--radiogroup .sd-selectbase__label,
  .sd-question--radiogroup .sd-selectbase__label-text {
    margin-left: 0 !important;
    padding-left: 0 !important;
    text-align: left !important;
    width: 100%;
  }

  .sd-question--radiogroup .sd-selectbase__label {
    display: inline-flex;
    align-items: center;
  }

  .sd-question--radiogroup .sd-selectbase__control {
    margin-right: 0.5rem;
  }

  /* Center the entire radiogroup options block */
  .sd-question--radiogroup .sd-selectbase {
  display: flex;
  justify-content: center;  /* horizontally center the list */
  }

/* Make sure the inner list doesn’t stretch full width */
  .sd-question--radiogroup .sd-selectbase__list {
  width: auto;
  margin: 0 auto;
  }

  /* NCMLabGeneral.css zeros out .sd-element--with-frame padding, but SurveyJS
     still applies a negative margin-left on the error box to bleed past that
     padding. With 0 padding there is nothing to compensate for, so the bar
     shifts left and gets clipped. Reset the margin so it stays in bounds. */
  .sd-element--with-frame > .sd-element__erbox {
    margin-left: 0 !important;
    margin-right: 0 !important;
    width: 100% !important;
  }

  /* "Proceed with unanswered question" button (isSuggested override) */
  .suggested-proceed-btn button,
  .suggested-proceed-btn input[type="button"],
  .suggested-proceed-btn .sd-btn {
    background-color: #f0ad4e !important;
    border-color: #eb9316 !important;
    color: #202020 !important;
  }
</style>


    
      
   <script>
     

      function downloadCSV(filename, csvString) {
        const blob = new Blob([csvString], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);
      }

     
      function addFlatResponseToData(trialData) {
        const resp = trialData.response || {};
        jsPsych.data.addProperties(resp);
      }

      // Recursively collects the `name` of every question flagged `isSuggested: true`
      // anywhere in the survey JSON (pages, panels, paneldynamic templates, etc.).
      function collectSuggestedNames(node, names) {
        names = names || new Set();
        if (Array.isArray(node)) {
          node.forEach(function (item) { collectSuggestedNames(item, names); });
        } else if (node && typeof node === "object") {
          if (node.isSuggested === true && typeof node.name === "string") {
            names.add(node.name);
          }
          Object.keys(node).forEach(function (key) {
            collectSuggestedNames(node[key], names);
          });
        }
        return names;
      }

      // Wires up the "isSuggested" behavior: a soft, non-blocking version of isRequired.
      // Unanswered isSuggested questions show the same red error styling as a required
      // question, and both page-to-page "Next" and the final "Complete" are held until
      // the participant either answers them or clicks "Proceed with unanswered question".
      // Once that button is clicked for a given question, that question is remembered
      // as acknowledged and will not be re-flagged later (e.g. at final Complete after
      // already being overridden on its own page).
      function setupSuggestedQuestions(survey) {
        var suggestedNames = collectSuggestedNames(EN_CostOfSport.survey_JSON);
        if (suggestedNames.size === 0) return;

        var overrideConfirmed = false;
        var pendingAction = null; // "nextPage" | "complete", set right before a block
        var lastFlaggedNames = [];
        var acknowledgedUnanswered = new Set();
        var suggestedMessage = "This question is optional but suggested. Please answer it, or click \"Proceed with unanswered question\" below.";

        var proceedAction = survey.addNavigationItem({
          id: "proceed-unanswered",
          title: "Proceed with unanswered question",
          visible: false,
          css: "suggested-proceed-btn",
          action: function () {
            overrideConfirmed = true;
            if (pendingAction === "nextPage") {
              survey.nextPage();
            } else {
              survey.completeLastPage();
            }
          }
        });

        function unansweredAmong(questions) {
          return questions.filter(function (q) {
            return suggestedNames.has(q.name) && q.isEmpty() && !acknowledgedUnanswered.has(q.name);
          });
        }

        function unansweredAcrossSurvey() {
          var unanswered = [];
          suggestedNames.forEach(function (name) {
            var q = survey.getQuestionByName(name);
            if (q && q.isEmpty() && !acknowledgedUnanswered.has(name)) unanswered.push(q);
          });
          return unanswered;
        }

        function flag(unanswered) {
          lastFlaggedNames = unanswered.map(function (q) { return q.name; });
          unanswered.forEach(function (q) { q.addError(suggestedMessage); });
          proceedAction.visible = true;
          unanswered[0].focus();
        }

        function consumeOverride() {
          overrideConfirmed = false;
          lastFlaggedNames.forEach(function (name) { acknowledgedUnanswered.add(name); });
          lastFlaggedNames = [];
          proceedAction.visible = false;
        }

        survey.onCurrentPageChanging.add(function (sender, options) {
          if (!options.isGoingForward) return;
          if (overrideConfirmed) {
            consumeOverride();
            return;
          }
          var unanswered = unansweredAmong(options.oldCurrentPage.questions);
          if (unanswered.length > 0) {
            options.allowChanging = false;
            pendingAction = "nextPage";
            flag(unanswered);
          }
        });

        survey.onCompleting.add(function (sender, options) {
          if (overrideConfirmed) {
            consumeOverride();
            return;
          }
          var unanswered = unansweredAcrossSurvey();
          if (unanswered.length > 0) {
            options.allowComplete = false;
            pendingAction = "complete";
            flag(unanswered);
          }
        });

        survey.onValueChanged.add(function (sender, options) {
          if (!suggestedNames.has(options.name)) return;
          options.question.clearErrors();
          if (unansweredAcrossSurvey().length === 0) {
            proceedAction.visible = false;
          }
        });
      }



      var jsPsych = initJsPsych({
        display_element: 'jspsych-target',
        show_progress_bar: false,
        auto_update_progress_bar: false,

      
        on_finish: function () {
          console.log(jsPsych.data.get());
          console.log(jsPsych.data.get().csv());
          const csv = jsPsych.data.get().csv();
          const ts = new Date().toISOString().replace(/[:.]/g, "-");
          const filename = "CostOfSport_" + ts + ".csv";

          downloadCSV(filename, csv);
          //jsPsych.data.displayData('json');
          
        }
      });

      console.log("Loaded survey JSON:", EN_CostOfSport.survey_JSON);

  

      var form_trial = {
        type: jsPsychSurvey,
        survey_json: function () {
          return EN_CostOfSport.survey_JSON;
        },
        survey_function: function (survey) {
          setupSuggestedQuestions(survey);
        },
        button_label: "Submit",
        required: true,


        on_finish: function (data) {
          console.log("Survey trial data:", data);
          addFlatResponseToData(data);
          jatos.submitResultData(data);
      
        }
      };
      jatos.onLoad(() =>
        {
          jsPsych.run([form_trial]);
      })
     
      
    </script>
