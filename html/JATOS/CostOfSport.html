<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex">
    <meta name="description" content="jsPsych Questionnaire">
    <meta name="keywords" content="HTML, CSS, JavaScript">
    <meta name="author" content="Jason Steffener, NCMLab">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" type="text/css" href="css/CostOfSport.css">
    <script src="jatos.js"></script>
    <script src="jspsych/dist/jspsych.js"></script>
    <script src="jspsych/dist/plugin-survey.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.14.0/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/survey-core@latest/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-jquery@latest/survey.jquery.min.js"></script>
    <script src="InstructionsAndStimuli/EN/Questionnaires/costOfSport.js"></script>
    <script src="functions/TaskSpecificFunctions/CostOfSport_functions.js"></script>

    <script>
      var jsPsych = initJsPsych({
        display_element: 'jspsych-target',
        show_progress_bar: false,
        auto_update_progress_bar: false,

        on_finish: async function () {
          // Only work with data in "response", with the matrix questions unpacked
          var response = jsPsych.data.get().trials[0].response;
          var flat = flattenSurveyResponse(response);

          // Keep the data in the predescribed order given by CodeBookSheet.csv,
          // regardless of how many entries any dynamicmatrix ended up unpacking.
          try {
            const csv = await buildOrderedCSV(flat, "assets/OutputDataFormatting/CodeBookSheet.csv");
            // Local copy of the data; remove once testing is completed
            downloadCSV(costOfSportFilename(), csv);
            await jatos.submitResultData(csv);
          } catch (error) {
            console.error("Error saving ordered CSV:", error);
          }
        }
      });

      var form_trial = {
        type: jsPsychSurvey,
        survey_json: function () {
          return EN_CostOfSport.survey_JSON;
        },
        survey_function: setupCostOfSportSurvey,
        button_label: "Submit",
        required: true,

        on_finish: function (data) {
          addFlatResponseToData(data);
        }
      };

      jatos.onLoad(() => {
        jsPsych.run([form_trial]);
      });
    </script>
  </head>

  <body>
    <div id="jspsych-target"></div>
  </body>
</html>
